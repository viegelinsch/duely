services:
  # Development server with hot reload
  duely-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: duely-development
    ports:
      - "8000:8000"
      - "4200:4200"
      - "49152:49152"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run serve

  # Production server
  duely-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-server
    container_name: duely-production
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # The production stage installs no curl, so the previous probe could never
      # pass. Node is the runtime the image actually ships: ask the server for the
      # root document and treat only a 2xx answer as ready.
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8000/').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Build service (one-shot)
  duely-build:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: duely-builder
    volumes:
      - ./dist:/app/dist
